name: Deploy to InfinityFree
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build version metadata
        run: node bin/build-update-metadata.mjs --apply
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .env
            env
            env.example
            **/.env*
            **/*.pem
            **/*.key
            **/*.p12
            **/*.pfx
            **/*.ppk
            **/*.jks
            **/*secret*
            **/*credential*
            **/*private-key*
            bin/build-update-metadata.mjs
            .gemini/**
            .claude/**
            .agents/**
            .opencode/**
            anti-slop/**
            database/**
            .github/**
            storage/logs/**
            storage/private/**
            *.sql
            *.md
