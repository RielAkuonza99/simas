name: Deploy to InfinityFree
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build version metadata
        run: node bin/build-update-metadata.mjs --apply
      # InfinityFree tidak punya Composer, dan /vendor/ ada di .gitignore.
      # Tanpa langkah ini folder vendor tidak pernah terunggah dan ekspor PDF (Dompdf) gagal.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install dependensi PHP (tanpa dev)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          # Buang berkas yang tidak dipakai saat runtime supaya unggahan FTP lebih ringan.
          find vendor -type d \( -iname tests -o -iname test -o -iname docs -o -iname doc -o -iname examples \) -prune -exec rm -rf {} +
          test -f vendor/autoload.php && test -d vendor/dompdf/dompdf/src
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .env
            env
            env.example
            **/.env*
            **/*.pem
            **/*.key
            **/*.p12
            **/*.pfx
            **/*.ppk
            **/*.jks
            **/*secret*
            **/*credential*
            **/*private-key*
            bin/build-update-metadata.mjs
            .gemini/**
            .claude/**
            .agents/**
            .opencode/**
            anti-slop/**
            database/**
            .github/**
            storage/logs/**
            storage/private/**
            *.sql
            *.md
